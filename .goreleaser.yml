# .goreleaser.yml — cross-platform binary release config.
# See https://goreleaser.com/customization/ for the full schema.
version: 2

project_name: chaindora

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: chaindora
    main: ./cmd/chdora
    binary: chdora
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/alessandro-bitetto/chaindora/internal/cli.Version={{.Version}}

archives:
  - id: chaindora
    ids: [chaindora]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - incidents/*.yaml

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: alessandro-bitetto
    name: chaindora
  draft: false
  prerelease: auto
  header: |
    ## Chaindora {{ .Tag }}

    Supply-chain detection for npm, PyPI, .NET/NuGet, Go modules and
    Rust/crates.io, plus verified frozen npm installation on macOS/Linux.

    ### Upgrade notes

    - **Breaking install scope:** the gate accepts only frozen public-registry
      npm restores from reviewed v2/v3 lockfiles. Other manager install/run/build
      commands refuse; scanning and single-package checks remain available.
    - Accepted installs verify artifact digests and identities, disable lifecycle
      scripts, stage offline, compare installed files and use locks plus private
      journals to recover process interruptions.
    - OSV MAL advisories are Critical even without CVSS. npm aliases retain
      canonical identities; installed npm source changes are detected.
    - CI reports incomplete inventory, incident, integrity and predictive checks
      as unsuppressible exit 2 errors. Invalid severity policies and suppression
      YAML/dates fail validation; expired exceptions stop suppressing findings.
    - Offline/skip-registry settings override fresh-popular requests. Fetch an
      incident pack before offline use or explicitly select reduced coverage.
    - Fleet dashboard/API reads require an independent operator credential;
      enrollment is disabled until configured and listeners default to loopback.

    Review the [changelog](https://github.com/alessandro-bitetto/chaindora/blob/{{ .Tag }}/CHANGELOG.md)
    and [migration guidance](https://github.com/alessandro-bitetto/chaindora/blob/main/docs/troubleshooting.md)
    before updating an existing gate or fleet deployment.

    Download the archive for your operating system and architecture, extract
    `chdora` (`chdora.exe` on Windows), add it to PATH, then run `chdora update`
    and `chdora scan .` from your project directory.

    Each archive has a SHA-256 entry in `chaindora_{{ .Version }}_checksums.txt`.
    Verify your downloaded archive against that entry before installation.

    [Documentation](https://github.com/alessandro-bitetto/chaindora/blob/main/docs/README.md)
    · [Threat model](https://github.com/alessandro-bitetto/chaindora/blob/{{ .Tag }}/docs/threat-model.md)
