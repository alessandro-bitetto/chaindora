name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required by goreleaser to publish the release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # goreleaser needs the full history to compute the changelog
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.22'
          cache: true

      # Fail closed if the website's fallback version drifted from the tag.
      # The release flow stamps it with `scripts/website-version.sh set vX.Y.Z`
      # before the release commit; a forgotten stamp stops here, not on the
      # live site.
      - name: verify website version matches the tag
        run: ./scripts/website-version.sh check "$GITHUB_REF_NAME"

      - name: goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
