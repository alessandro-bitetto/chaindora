name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: go build
        run: go build -o chdora ./cmd/chdora

  self-scan:
    name: chdora scans chaindora (dogfood)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.22'
          cache: true
      - name: build chdora
        run: go build -o chdora ./cmd/chdora
      - name: dogfood — scan our own repo
        # Exclusions:
        # - testdata/ contains intentional malicious fixtures (Shai-Hulud
        #   workflow file, lodash CVEs, curl|bash scripts) — they're scan
        #   targets, not real deps.
        # - website/ is the chaindora.dev Angular static site. Its
        #   build-time tooling (Angular CLI, webpack, esbuild, postcss)
        #   has its own CVE surface that doesn't ship with the chdora
        #   binary. The site is built and deployed independently.
        run: ./chdora ci . --exclude testdata --exclude website --fail-on critical,high --sarif chdora.sarif
      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        if: always()
        with:
          sarif_file: chdora.sarif
