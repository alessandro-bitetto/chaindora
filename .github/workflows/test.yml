name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: go build
        run: go build -o chdora ./cmd/chdora

  self-scan:
    name: chdora scans chaindora (dogfood)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.22'
          cache: true
      - name: build chdora
        run: go build -o chdora ./cmd/chdora
      - name: dogfood — scan our own repo
        # Exclusions:
        # - testdata/ contains intentional malicious fixtures (Shai-Hulud
        #   workflow file, lodash CVEs, curl|bash scripts) — they're scan
        #   targets, not real deps.
        # - website/ is the chaindora.dev Angular static site. Its
        #   build-time tooling (Angular CLI, webpack, esbuild, postcss)
        #   has its own CVE surface that doesn't ship with the chdora
        #   binary. The site is built and deployed independently.
        run: ./chdora ci . --exclude testdata --exclude website --fail-on critical,high --sarif chdora.sarif
      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: chdora.sarif
