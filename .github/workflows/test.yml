name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: go build
        run: go build -o chdora ./cmd/chdora

  self-scan:
    name: chdora scans chaindora (dogfood)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.22'
          cache: true
      - name: build chdora
        run: go build -o chdora ./cmd/chdora
      - name: dogfood — scan our own repo
        # testdata/ contains intentional malicious fixtures (Shai-Hulud
        # workflow file, lodash CVEs, curl|bash scripts) — exclude it so the
        # self-scan reflects only the real chaindora code + CI config.
        run: ./chdora ci . --exclude testdata --fail-on critical,high --sarif chdora.sarif
      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360  # v3
        if: always()
        with:
          sarif_file: chdora.sarif
