name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: 'stable'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: Real frozen npm restore (inert archives; offline npm)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CHAINDORA_TEST_NPM="$(command -v npm)"
          go test ./internal/gate -run 'TestNPMFrozenInstall.*RealOffline' -count=1 -v
      - name: Versioned credential-shape corpus
        run: go test ./internal/gate -run '^TestCredentialPatterns$' -count=1 -v
      - name: go build
        run: go build -o chdora-test-cli.exe ./cmd/chdora
      - name: Offline CLI regression contracts (inert fixtures only)
        run: python tests/offline_cli.py --binary ./chdora-test-cli.exe --output ./test-results/offline-cli
      - name: Keep CLI validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: offline-cli-${{ matrix.os }}
          path: test-results/offline-cli

  environment-contracts:
    name: Real package managers (harmless fixtures, offline containers)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: 'stable'
          cache: true
      - name: Prepare toolchains and run isolated contracts
        # Only toolchain preparation has network access. Tests use generated
        # harmless packages, --network=none and read-only mounts; no malware.
        run: python3 tests/run_environments.py --prepare --output ./test-results/environments
      - name: Keep resolver and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: environment-contracts-linux
          path: test-results/environments

  self-scan:
    name: chdora scans chaindora (dogfood)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: 'stable'
          cache: true
      - name: build chdora
        run: go build -o chdora ./cmd/chdora
      - name: dogfood — scan our own repo
        # Exclusions:
        # - testdata/ contains intentional malicious fixtures (Shai-Hulud
        #   workflow file, lodash CVEs, curl|bash scripts) — they're scan
        #   targets, not real deps.
        # - website/ is the chaindora.dev Angular static site. Its
        #   build-time tooling (Angular CLI, webpack, esbuild, postcss)
        #   has its own CVE surface that doesn't ship with the chdora
        #   binary. The site is built and deployed independently.
        run: ./chdora ci . --exclude testdata --exclude website --fail-on critical,high --sarif chdora.sarif
      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: chdora.sarif
