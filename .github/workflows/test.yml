name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: go build
        run: go build -o chaindora ./cmd/chaindora

  self-scan:
    name: chaindora scans chaindora (dogfood)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: build chaindora
        run: go build -o chaindora ./cmd/chaindora
      - name: dogfood — scan our own repo
        # testdata/ contains intentional malicious fixtures (Shai-Hulud
        # workflow file, lodash CVEs, curl|bash scripts) — exclude it so the
        # self-scan reflects only the real chaindora code + CI config.
        run: ./chaindora ci . --exclude testdata --fail-on critical,high --sarif chaindora.sarif
      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: chaindora.sarif
