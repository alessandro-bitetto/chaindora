# Dependabot keeps SHA-pinned GitHub Actions current. Without this,
# `.github/workflows/*.yml` would freeze at whatever commit SHA was
# checked in — security fixes to actions/checkout, actions/setup-go,
# goreleaser/goreleaser-action, github/codeql-action would never reach
# us. With weekly checks Dependabot opens a PR whenever any pinned
# action has a newer tagged release on its tracked major branch.
#
# See https://docs.github.com/en/code-security/dependabot/working-with-dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    # Two policies for GitHub-published actions:
    #
    # 1. Minor + patch bumps are grouped into one PR per week
    #    (`github-actions-core`). These are routine security /
    #    bugfix updates that are safe to merge in a single batch.
    #
    # 2. Major bumps come in as INDIVIDUAL PRs — no grouping,
    #    explicit one-action-at-a-time. Major versions of these
    #    actions historically include breaking changes (e.g.
    #    actions/checkout v4 → v6 changed Node runtime version)
    #    and deserve case-by-case review.
    #
    # The split means accidentally hitting "merge" on a bundled
    # weekly PR can't pull in a breaking change behind your back.
    groups:
      github-actions-core:
        patterns:
          - "actions/*"
          - "github/codeql-action*"
          - "goreleaser/*"
        update-types:
          - "minor"
          - "patch"

  # Go modules: chdora intentionally minimal (cobra + yaml.v3 only).
  # Weekly polling keeps us informed of security advisories without
  # being noisy. Same major-bump split as github-actions: bundle
  # minor + patch, surface majors individually.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
