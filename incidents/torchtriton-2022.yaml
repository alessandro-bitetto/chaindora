schema: 1
id: PYPI-TORCHTRITON-DEPCONFUSION-2022-12
name: PyTorch torchtriton dependency-confusion exfiltration
severity: critical
date: "2022-12-30"
summary: |
  Between 2022-12-25 and 2022-12-30, anyone who installed
  `pytorch-nightly` via pip pulled a malicious `torchtriton` package
  from public PyPI instead of the intended internal PyTorch index.

  The malicious package read and exfiltrated:
    - /etc/passwd, /etc/hostname, /etc/hosts
    - ~/.gitconfig
    - ~/.ssh/* (including private keys)
    - environment variables
    - the first 1000 files in $HOME with a size cap
  to a remote host (`*.h4ck.cfd`) at import time.

  PyTorch's mitigation was to rename the internal dependency from
  `torchtriton` to `pytorch-triton` and reserve the `torchtriton` name
  on public PyPI with an empty placeholder package. Any version of
  `torchtriton` from public PyPI installed during the attack window
  should be considered malware.

references:
  - "https://pytorch.org/blog/compromised-nightly-dependency/"
  - "https://blog.aquasec.com/pytorch-supply-chain-attack-torchtriton"

packages:
  - ecosystem: PyPI
    name: "torchtriton"
    versions: ["*"]

post_compromise:
  - "Regenerate all SSH keys present in ~/.ssh on the affected host and revoke the old keys from every authorized_keys file they reached."
  - "Inspect ~/.gitconfig and rotate any embedded tokens (e.g. github.com PATs in url.<base>.insteadOf rewrites)."
  - "Check for outbound connections to *.h4ck.cfd in firewall / EDR logs covering the install timeframe."
  - "Audit /etc/hosts for unauthorized additions and confirm AWS / GCP instance-metadata tokens were not accessible from the install environment."
