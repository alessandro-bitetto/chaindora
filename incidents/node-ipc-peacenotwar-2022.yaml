schema: 1
id: NPM-NODE-IPC-PEACENOTWAR-2022-03
name: node-ipc / peacenotwar geo-targeted file wiper
severity: critical
date: "2022-03-15"
summary: |
  In March 2022 the maintainer of `node-ipc` (RIAEvangelist) published
  versions that contained a geo-targeted file-wiping payload. Versions
  10.1.1, 10.1.2, and 10.1.3 (published 2022-03-07 through 2022-03-08)
  resolved the host's external IP and, if it geolocated to Russia or
  Belarus, recursively overwrote files under the user's home directory
  with a heart emoji.

  Subsequent releases (11.0.0+) replaced the wiper with `peacenotwar`,
  a less destructive protestware module that printed messages and
  wrote files to the Desktop, but still constitutes unauthorised side
  effects in a build-time dependency.

  Tracked as CVE-2022-23812. Affected indirect consumers via Vue.js
  CLI's `unicode-byte-truncate` chain, among others.

references:
  - "https://nvd.nist.gov/vuln/detail/CVE-2022-23812"
  - "https://snyk.io/blog/peacenotwar-malicious-npm-node-ipc-package-vulnerability/"
  - "https://github.com/advisories/GHSA-97m3-w2cp-4xx6"

packages:
  - ecosystem: npm
    name: "node-ipc"
    versions:
      - "10.1.1"
      - "10.1.2"
      - "10.1.3"
    safe_version: "9.2.1"
  - ecosystem: npm
    name: "peacenotwar"
    versions: ["*"]

post_compromise:
  - "If the affected host has a Russian or Belarusian external IP, audit ~/ for missing or heart-emoji-corrupted files (the wiper ran during install)."
  - "Check Desktop/ for stray `WITH-LOVE-FROM-AMERICA.txt` and similar protestware drops left by peacenotwar."
