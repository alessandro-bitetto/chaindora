schema: 1
id: NPM-LOTTIE-PLAYER-2024-10
name: "@lottiefiles/lottie-player crypto wallet drainer"
severity: critical
date: "2024-10-30"
summary: |
  On 2024-10-30 the npm package `@lottiefiles/lottie-player` was
  compromised after an attacker obtained valid publish credentials for
  a LottieFiles developer account. Three malicious versions were
  pushed (2.0.5, 2.0.6, 2.0.7) within a one-hour window. The payload
  injected a fake Web3 wallet-connect prompt into pages that loaded
  the player, which when "approved" by a visitor signed a transaction
  draining the visitor's wallet.

  Because the player is served from CDNs (jsDelivr, unpkg) as well as
  npm-bundled, the blast radius extended to every site that
  hot-linked the affected version range during the window.

  LottieFiles revoked the malicious versions and published 2.0.8 as
  the post-incident clean release.

references:
  - "https://www.lottiefiles.com/blog/lottie-player-security-incident-october-30-2024"
  - "https://blog.checkmarx.com/2024/10/31/the-lottiefiles-supply-chain-attack-a-warning-for-web3-and-crypto-users/"
  - "https://socket.dev/blog/lottiefiles-issues-warning-about-compromised-lottie-player-npm-package"

packages:
  - ecosystem: npm
    name: "@lottiefiles/lottie-player"
    versions:
      - "2.0.5"
      - "2.0.6"
      - "2.0.7"
    safe_version: "2.0.8"

post_compromise:
  - "Any wallet that visited a site loading the compromised player and approved a connect prompt should be considered drained — move remaining funds to a fresh wallet."
  - "Audit any LottieFiles developer access tokens; the maintainer credential used to publish was compromised, so siblings may be too."
  - "Check CDN cache invalidation: jsDelivr / unpkg may still serve the bad version for hours after npm yanks if the cache key isn't busted."
