schema: 1
id: NPM-ESLINT-SCOPE-2018-07
name: eslint-scope npm credential stealer
severity: critical
date: "2018-07-12"
summary: |
  On 2018-07-12 the npm packages `eslint-scope` 3.7.2 and
  `eslint-config-eslint` 5.0.2 were published with malicious code that
  read the local user's `~/.npmrc`, extracted the npm auth token, and
  POSTed it to a pastebin. The packages were pulled from npm and
  invalidated within hours.

  Root cause: a single ESLint maintainer's npm account was compromised
  via password reuse. The published malicious versions had no other code
  changes, so consumers who picked up the patch through `^3.7.0`
  semver ranges were silently affected.

  Any npm token published from a machine that installed the compromised
  versions during the attack window must be treated as exposed.

references:
  - "https://eslint.org/blog/2018/07/postmortem-for-malicious-package-publishes/"
  - "https://github.com/advisories/GHSA-mp93-pq8c-vjqc"

packages:
  - ecosystem: npm
    name: "eslint-scope"
    versions:
      - "3.7.2"
    safe_version: "3.7.3"
  - ecosystem: npm
    name: "eslint-config-eslint"
    versions:
      - "5.0.2"
    safe_version: "5.0.3"

post_compromise:
  - "Rotate the npm token in ~/.npmrc on any machine that ran `npm install` while these versions were live (2018-07-12 ~02:40 UTC to ~05:30 UTC)."
  - "Revoke and re-issue npm 2FA recovery codes on affected accounts."
