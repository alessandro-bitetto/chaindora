schema: 1
id: NPM-UA-PARSER-JS-2021
name: ua-parser-js maintainer account compromise
severity: critical
date: "2021-10-22"
summary: |
  The maintainer's npm account for ua-parser-js was compromised and three
  malicious versions were published containing a cryptominer
  (jsextension) and a credential stealer. CISA issued an alert. The
  malicious versions were live for approximately four hours before the
  maintainer regained control and pushed clean replacements.

references:
  - "https://github.com/faisalman/ua-parser-js/issues/536"
  - "https://www.cisa.gov/news-events/alerts/2021/10/22/malware-discovered-popular-npm-package-ua-parser-js"
  - "https://github.com/advisories/GHSA-pjwm-rvh2-c87w"

packages:
  - ecosystem: npm
    name: "ua-parser-js"
    versions:
      - "0.7.29"
      - "0.8.0"
      - "1.0.0"
